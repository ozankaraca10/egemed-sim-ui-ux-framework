<!--
  EGEMED SIM FRAMEWORK — bileşen: Mod kartı (İnceleme / Uygulama / Değerlendirme)
  ====================================================================================
  Kaynak: cardai/app.js renderModes() içindeki `learn`/`practice`/`assessment`
  şablon dizgeleri (satır ~118-120) + reference/pulse/YONERGE_MOD_SECIM_EKRANI.md §2.

  NEDEN
  -----
  - ÜÇ KART HER ZAMAN GÖRÜNÜR ve TIKLANABİLİR — kilitli olan bile. Ausculta'da mod
    kilidi yoktur; Pulse'ta pedagojik kilit vardır (İnceleme tamamlanmadan Uygulama,
    Uygulama tamamlanmadan Değerlendirme açılmaz). Kilidi "gizleme" yerine "görünür +
    yönlendirici" yapmanın nedeni: kullanıcı ne kadar kaldığını ve NEDEN kilitli
    olduğunu her zaman görsün (şeffaflık); CTA metni "Kilidi aç → İnceleme'ye git"
    gibi yönlendirici olur, düz "disabled" değildir — kullanıcıyı doğru göreve
    yönlendirir (bkz. docs/03-mod-akisi-ve-pedagoji.md "Kilitler yalnız öneri
    değil, gerçek bir kapı — ama gönderim yolları asla kilide bağlı değil").
  - Kilit kuralı yalnız YÖNLENDİRMEYİ etkiler; kilitli bir moda URL/geliştirici
    konsolundan girilirse GÖNDERİM YİNE ÇALIŞIR (bkz. docs/03 "kilitler yalnız
    öneri" — Tur 1'de `casesUnlocked`/`quizUnlocked` kontrolleri gönderim
    fonksiyonlarından TAMAMEN kaldırıldı; yalnız mod ekranındaki YÖNLENDİRME ve
    `showView` düşürme mantığında kalır).
  - Durum satırı + ince ilerleme çubuğu: sayı + görsel çubuk birlikte — yalnız
    metin ("7/13") yeterli değildir, göz taraması için çubuk gerekir.
  - Renk kimliği: İnceleme=yeşil, Uygulama=mavi, Değerlendirme=mor — bu kimlik
    kartta, header çipinde ve soru kartı kenarlığında AYNI kalır (tekrarlanan
    ipucu, mod karışıklığını önler).
  - **Kararlı yeniden çizim (Tur 5):** Bu kartların ilerleme yüzdesi periyodik
    olarak (Pulse'ta 250 ms'de bir) güncellenir; bu döngü kart HTML'ini karşılaştırma
    YAPMADAN her seferinde `innerHTML` ile yeniden kuruyorsa, kullanıcı tam o
    pencerede bastığı düğmeyi "parmağının altından" kaybedebilir (tıklama sessizce
    kaybolur). Bkz. docs/04-etkilesim-ve-erisilebilirlik.md §9 ve
    snippets/stableRender.js — bu bileşeni periyodik güncelleyen HER ürün aynı
    kararlı-render kalıbını kullanmalıdır.

  PULSE'TA NEREDE
  ----------------
  cardai/app.js `renderModes(gates)` — `learn`/`practice`/`assessment` şablonları;
  kilit durumunda CTA `data-view` kilidi açan görünümü hedefler (kendini değil).
  `derivePrerequisites()` (cardai/state.js `derive`) kapıları hesaplar. Kararlı
  render: `box.dataset.rendered`/`box.dataset.bound` kalıbı (Tur 5 — bkz.
  snippets/stableRender.js) — döngü `progress()`'in 250 ms'lik tetiklemesinden gelir.

  ÜRÜN-BAĞIMSIZ KULLANIM
  ------------------------
  {{OGE_TERIMI_COGUL}} = "EKG sonucu" (Pulse) | "ses kaydı" (Ausculta, öneri) |
  [Opaca: belirlenecek]; {{MOD_ADI}}, {{MOD_SINIFI}} = learn|practice|assessment;
  {{ACIKLAMA}}, {{IZLENEN}}/{{TOPLAM}}, {{YUZDE}}, {{CTA_METNI}}, {{HEDEF_GORUNUM}}.
-->

<!-- Açık (kilitsiz) kart — ör. İnceleme Modu -->
<article class="mode-card {{MOD_SINIFI}}">
  <span class="ic">{{MOD_IKONU_SVG}}</span>
  <h3>{{MOD_ADI}}</h3>
  <p class="desc">{{ACIKLAMA}}</p>
  <ul>
    <li><span class="ck" aria-hidden="true">✓</span>{{MADDE_1}}</li>
    <li><span class="ck" aria-hidden="true">✓</span>{{MADDE_2}}</li>
    <li><span class="ck" aria-hidden="true">✓</span>{{MADDE_3}}</li>
  </ul>
  <div class="mode-status">
    {{IZLENEN}}/{{TOPLAM}} {{OGE_TERIMI_COGUL}} izlendi
    <div class="mode-progress"><i style="width:{{YUZDE}}%"></i></div>
  </div>
  <button class="btn" type="button" data-view="{{HEDEF_GORUNUM}}">{{CTA_METNI}} <span aria-hidden="true">→</span></button>
</article>

<!-- Kilitli kart — görünür + yönlendirici (gizlenmez, disabled yapılmaz) -->
<article class="mode-card {{MOD_SINIFI}} locked">
  <span class="ic">{{MOD_IKONU_SVG}}<span class="lock-badge">🔒 Kilitli</span></span>
  <h3>{{MOD_ADI}}</h3>
  <p class="desc">{{ACIKLAMA}}</p>
  <ul>…</ul>
  <div class="mode-status" id="lockReason-{{MOD_SINIFI}}">
    Açılması için {{ON_KOSUL_METNI}} — {{ILERLEME_METNI}}
    <div class="mode-progress"><i style="width:{{ON_KOSUL_YUZDESI}}%"></i></div>
  </div>
  <!-- CTA kilitli modu DEĞİL, kilidi açan (ön koşul) görünümü hedefler -->
  <button class="btn" type="button" data-view="{{ON_KOSUL_GORUNUM}}" aria-describedby="lockReason-{{MOD_SINIFI}}">
    Kilidi aç → {{ON_KOSUL_MOD_ADI}}'ne git <span aria-hidden="true">→</span>
  </button>
</article>
